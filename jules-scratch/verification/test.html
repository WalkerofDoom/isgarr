<!DOCTYPE html>
<html>
<head>
    <title>Test</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/handlebars.js/4.7.7/handlebars.min.js"></script>
</head>
<body>
    <h1>Armadura Sheet</h1>
    <div id="armadura-sheet"></div>
    <h1>Especie Sheet</h1>
    <div id="especie-sheet"></div>

    <script id="armadura-sheet-template" type="text/x-handlebars-template">
        <form class="{{cssClass}}" autocomplete="off">
  <header class="sheet-header">
    <img class="profile-img" src="{{item.img}}" data-edit="img" title="{{item.name}}"/>
    <div class="header-fields">
      <h1 class="charname"><input name="name" type="text" value="{{item.name}}" placeholder="Nome da Armadura"/></h1>
    </div>
  </header>

  <section class="sheet-body">
    <div class="form-group">
      <label>Bônus</label>
      <input type="number" name="system.bonus" value="{{systemData.bonus}}" />
    </div>
    <div class="form-group">
      <label>Tipo</label>
      <input type="text" name="system.tipo" value="{{systemData.tipo}}" />
    </div>
    <div class="form-group">
      <label>Descrição</label>
      <textarea name="system.description">{{systemData.description}}</textarea>
    </div>
  </section>
</form>
    </script>

    <script id="especie-sheet-template" type="text/x-handlebars-template">
        <form class="{{cssClass}}" autocomplete="off">
  <header class="sheet-header">
    <img class="profile-img" src="{{item.img}}" data-edit="img" title="{{item.name}}"/>
    <div class="header-fields">
      <h1 class="charname"><input name="name" type="text" value="{{item.name}}" placeholder="Nome da Espécie"/></h1>
    </div>
  </header>

  <section class="sheet-body">
    <div class="form-group">
      <label>Bônus</label>
      <textarea name="system.bonus" rows="5">{{systemData.bonus}}</textarea>
    </div>
    <div class="form-group">
      <label>Descrição</label>
      <textarea name="system.description">{{systemData.description}}</textarea>
    </div>
  </section>
</form>
    </script>

    <script>
        const armaduraData = {
            item: {
                name: "Test Armor",
                img: "icons/svg/mystery-man.svg"
            },
            systemData: {
                bonus: 5,
                tipo: "Pesada",
                description: "A test armor."
            }
        };

        const especieData = {
            item: {
                name: "Test Species",
                img: "icons/svg/mystery-man.svg"
            },
            systemData: {
                bonus: "For +2",
                description: "A test species."
            }
        };

        const armaduraSource = document.getElementById('armadura-sheet-template').innerHTML;
        const armaduraTemplate = Handlebars.compile(armaduraSource);
        const armaduraHtml = armaduraTemplate(armaduraData);
        document.getElementById('armadura-sheet').innerHTML = armaduraHtml;

        const especieSource = document.getElementById('especie-sheet-template').innerHTML;
        const especieTemplate = Handlebars.compile(especieSource);
        const especieHtml = especieTemplate(especieData);
        document.getElementById('especie-sheet').innerHTML = especieHtml;
    </script>
</body>
</html>
